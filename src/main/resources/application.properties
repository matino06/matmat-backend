spring.application.name=EduSprint
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3-bucket-name=${AWS_S3_BUCKET_NAME}

turnstile.verify-url=${TURNSTILE_VERIFY_URL}
turnstile.secret-key=${TURNSTILE_SECRET_KEY}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.matmat.online/
auth0.audience=https://api.matmat.online
auth0.claims-namespace=https://api.matmat.online/
# Deleting an account: Management API app with only delete:users (tenant domain, not the custom login domain)
auth0.management.domain=matmat.eu.auth0.com
auth0.management.client-id=${AUTH0_MGMT_CLIENT_ID:}
auth0.management.client-secret=${AUTH0_MGMT_CLIENT_SECRET:}

# Deleting an account: revoking Sign in with Apple (the .p8 key's contents in APPLE_PRIVATE_KEY; client = app bundle ID)
apple.team-id=${APPLE_TEAM_ID:}
apple.key-id=${APPLE_KEY_ID:}
apple.client-id=${APPLE_CLIENT_ID:online.matmat.app}
apple.private-key=${APPLE_PRIVATE_KEY:}

resend.api-key=${RESEND_API_KEY}

# Odjava od podsjetnika: link u mailu potpisan je ovim ključem (bez zasebne varijable koristi Resend ključ)
app.public-api-url=https://api.matmat.online/api
email.unsubscribe-secret=${EMAIL_UNSUBSCRIBE_SECRET:${RESEND_API_KEY}}

# OpenRouter (ključ za ocjenjivanje probne mature)
# Modeli, dnevni limit, max tokens i reasoning effort su u tablici ai_settings (admin dashboard)
openrouter.api-key=${OPENROUTER_GRADING_API_KEY}
openrouter.api-base-url=https://openrouter.ai/api/v1

# AI chat
ai.chat.api-key=${OPENROUTER_CHAT_API_KEY}
# SSE stream AI chata (Tomcat default async timeout je 30s)
spring.mvc.async.request-timeout=180s

# Vlastiti predmeti: zaseban OpenRouter ključ (mjesečni limit postavljen na OpenRouteru)
own-courses.openrouter.api-key=${OPENROUTER_OWN_COURSES_API_KEY:}
# Koliko koraka izrade radi istodobno na jednoj instanci
own-courses.build.concurrency=8
# false: ova instanca ne izvršava poslove izrade (npr. lokalno, jer lokalni profil koristi produkcijsku bazu)
own-courses.build.enabled=true
# Modeli za zadatke vlastitih predmeta: 1. varijacija, predfilter i presuda „preblizu zadatku s ispita“
own-courses.models.writer=openai/gpt-6.1-sol
own-courses.models.embedding=openai/text-embedding-3-small
own-courses.models.decide=typesafe/jev-1.13
