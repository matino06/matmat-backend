spring.application.name=EduSprint
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3-bucket-name=${AWS_S3_BUCKET_NAME}

turnstile.verify-url=${TURNSTILE_VERIFY_URL}
turnstile.secret-key=${TURNSTILE_SECRET_KEY}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.matmat.online/
auth0.audience=https://api.matmat.online
auth0.claims-namespace=https://api.matmat.online/

resend.api-key=${RESEND_API_KEY}

gemini.api-key=${GEMINI_API_KEY}
gemini.model-text=gemini-2.5-flash-lite
gemini.model-vision=gemini-2.5-pro
gemini.api-base-url=https://generativelanguage.googleapis.com/v1beta