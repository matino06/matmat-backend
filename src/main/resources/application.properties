spring.application.name=EduSprint
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3-bucket-name=${AWS_S3_BUCKET_NAME}

turnstile.verify-url=${TURNSTILE_VERIFY_URL}
turnstile.secret-key=${TURNSTILE_SECRET_KEY}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.matmat.online/
auth0.audience=https://api.matmat.online
auth0.claims-namespace=https://api.matmat.online/

resend.api-key=${RESEND_API_KEY}

# OpenRouter (ključ za ocjenjivanje probne mature)
openrouter.api-key=${OPENROUTER_GRADING_API_KEY}
openrouter.api-base-url=https://openrouter.ai/api/v1
openrouter.model-text=${OPENROUTER_GRADING_MODEL}
openrouter.model-vision=${OPENROUTER_GRADING_MODEL}

# AI chat
ai.chat.api-key=${OPENROUTER_CHAT_API_KEY}
ai.chat.model=${OPENROUTER_CHAT_MODEL}
ai.chat.daily-limit=30
ai.chat.max-tokens=4096
# SSE stream AI chata (Tomcat default async timeout je 30s)
spring.mvc.async.request-timeout=180s